name: Weekly business report

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, 03:00 UTC (8:30 AM India)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install pandas numpy resend python-dotenv
      - name: Build insights and forecast
        run: |
          python src/ai_insights.py
          python src/analytics/forecast.py
      - name: Email the report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python src/send_email_alert.py
